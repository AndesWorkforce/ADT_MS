# =============================================================================
# Stack Swarm / Portainer — producción (adt-ms)
# Desplegar en Portainer o: docker stack deploy -c docker-compose.yml pulse_adt_ms
#
# Desarrollo local (NATS + build): docker compose -f docker-compose-deployment.yml up --build
# =============================================================================
version: '3.8'

services:
  adt-ms:
    image: ghcr.io/andesworkforce/adt_ms:latest
    networks:
      - traefik-public
      - nats_nats_internal_network
      - default
      - pulse-db-prod_backend_network
      - clickhouse-prod_clickhouse-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.3'
          memory: 512M
    environment:
      NODE_ENV: production
      TZ: 'America/New_York'
      EVENTS_TIMEZONE: 'America/New_York'
      NODE_OPTIONS: '--max-old-space-size=1536'
      PORT: '${PORT:-3005}'
      DATABASE_URL: '${DATABASE_URL}'
      NATS_HOST: '${NATS_HOST:-72.61.129.234}'
      NATS_PORT: '${NATS_PORT:-4222}'
      NATS_USERNAME: '${NATS_USERNAME:-andes_nats}'
      NATS_PASSWORD: '${NATS_PASSWORD:-andesworkforce_nats}'
      CLICKHOUSE_HOST: '${CLICKHOUSE_HOST}'
      CLICKHOUSE_PORT: '${CLICKHOUSE_PORT:-8123}'
      CLICKHOUSE_USERNAME: '${CLICKHOUSE_USERNAME}'
      CLICKHOUSE_PASSWORD: '${CLICKHOUSE_PASSWORD:-}'
      CLICKHOUSE_DATABASE: '${CLICKHOUSE_DATABASE:-andes_db}'
      REDIS_HOST: '${REDIS_HOST}'
      REDIS_PORT: '${REDIS_PORT:-6379}'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-}'
      REDIS_DB: '${REDIS_DB:-0}'
      REDIS_TTL: '${REDIS_TTL:-600}'
      REDIS_MAX_RETRIES: '${REDIS_MAX_RETRIES:-3}'
      REDIS_RETRY_DELAY: '${REDIS_RETRY_DELAY:-1000}'
      REDIS_QUEUE_DB: '${REDIS_QUEUE_DB:-1}'
      USE_EVENT_QUEUE: '${USE_EVENT_QUEUE:-true}'
      USE_SESSION_QUEUE: '${USE_SESSION_QUEUE:-true}'
      USE_CONTRACTOR_QUEUE: '${USE_CONTRACTOR_QUEUE:-true}'
      USE_ETL_QUEUE: '${USE_ETL_QUEUE:-true}'
      QUEUE_CONCURRENCY_EVENTS: '${QUEUE_CONCURRENCY_EVENTS:-5}'
      QUEUE_CONCURRENCY_SESSIONS: '${QUEUE_CONCURRENCY_SESSIONS:-3}'
      QUEUE_CONCURRENCY_CONTRACTORS: '${QUEUE_CONCURRENCY_CONTRACTORS:-2}'
      QUEUE_CONCURRENCY_ETL: '${QUEUE_CONCURRENCY_ETL:-1}'
      QUEUE_RETRY_ATTEMPTS: '${QUEUE_RETRY_ATTEMPTS:-3}'
      QUEUE_RETRY_BACKOFF_TYPE: '${QUEUE_RETRY_BACKOFF_TYPE:-exponential}'
      QUEUE_RETRY_BACKOFF_DELAY: '${QUEUE_RETRY_BACKOFF_DELAY:-5000}'
      USE_INACTIVITY_ALERTS: '${USE_INACTIVITY_ALERTS:-true}'
      INACTIVITY_THRESHOLD_MINUTES: '${INACTIVITY_THRESHOLD_MINUTES:-60}'
      INACTIVITY_SCAN_INTERVAL_MINUTES: '${INACTIVITY_SCAN_INTERVAL_MINUTES:-10}'
      DEV_LOGS: '${DEV_LOGS:-true}'
      ENVIRONMENT: '${ENVIRONMENT:-production}'

networks:
  default:
    name: andes-adt-ms-net
    driver: overlay
  traefik-public:
    external: true
  nats_nats_internal_network:
    external: true
  pulse-db-prod_backend_network:
    external: true
  clickhouse-prod_clickhouse-network:
    external: true
